server:
  port: ${RAGENT_SERVER_PORT:9090}
  # 停机先停止接收新请求并等在途请求结束；研究任务在步边界把租约交还队列（research.shutdown-grace-seconds）。
  shutdown: graceful
  servlet:
    context-path: /api/ragent

spring:
  application:
    name: ragent${unique-name:}-service
  lifecycle:
    timeout-per-shutdown-phase: 30s

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  datasource:
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    username: ${RAGENT_POSTGRES_USER:postgres}
    password: ${RAGENT_POSTGRES_PASSWORD:postgres}
    url: ${RAGENT_POSTGRES_URL:jdbc:postgresql://127.0.0.1:5432/ragent?client_encoding=UTF8}
    hikari:
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: RagentHikariPool

  data:
    redis:
      host: ${RAGENT_REDIS_HOST:127.0.0.1}
      port: ${RAGENT_REDIS_PORT:6380}
      password: ${RAGENT_REDIS_PASSWORD:123456}

rocketmq:
  name-server: ${RAGENT_ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: ragent-producer${unique-name:}_pg
    send-message-timeout: 2000

ragent:
  engine:
    type: workflow  # 执行架构档位，可选 workflow（v1 编排管线）/ agent（v2 ReAct 架构，RAG 管线降级为主 Agent 的一个 Tool）
  demo-mode: false
  eval:
    enabled: true

rag:
  storage:
    type: ${RAGENT_STORAGE_TYPE:s3}  # 可选 s3（rustfs / minio）/ oss（阿里云）
    kb-bucket: ${RAGENT_SOURCE_BUCKET:ragent-sources}        # 全局知识库桶（私有），所有知识库文档按 collectionName 目录隔离；OSS 桶名全局唯一，生产需按部署覆盖
    asset-bucket: ${RAGENT_ASSET_BUCKET:ragent-assets} # 多模态资产桶（公共读），PDF 抽出的图片等供浏览器匿名直连预览
    s3:
      endpoint: ${RAGENT_S3_ENDPOINT:http://localhost:9000}
      access-key: ${RAGENT_S3_ACCESS_KEY:rustfsadmin}
      secret-key: ${RAGENT_S3_SECRET_KEY:rustfsadmin}
      region: ${RAGENT_S3_REGION:us-east-1}
      path-style: true
      public-url: ${RAGENT_S3_PUBLIC_URL:}  # 内外网端点不同时配置，留空回退 endpoint
    oss:
      endpoint: https://oss-cn-hangzhou.aliyuncs.com
      access-key: ${OSS_ACCESS_KEY:}
      secret-key: ${OSS_SECRET_KEY:}
      region: cn-hangzhou
      public-url:  # 虚拟主机式基址（含 bucket 子域），如 https://ragent-assets.oss-cn-hangzhou.aliyuncs.com；留空由 endpoint 推导

  default:
    collection-name: rag_default_store
    dimension: 1536
    metric-type: COSINE
    sse-timeout-ms: 300000  # SSE 全局超时（毫秒），默认 5 分钟

  query-rewrite:
    enabled: true

  rerank:
    enabled: true

  citation:
    enabled: true  # 回答行内引用角标 [N](#cite-N)：开启会动态追加引用规则并为资料注入编号，增加首字延迟；关闭不影响文档级来源面板

  rate-limit:
    global:
      enabled: true
      max-concurrent: 10
      max-wait-seconds: 15
      lease-seconds: 30
      poll-interval-ms: 200

  memory:
    history-keep-turns: 8
    summary-enabled: true
    summary-start-turns: 9
    summary-max-chars: 400
    title-max-length: 30

  semaphore:
    document-upload:
      name: rag:document:upload
      max-concurrent: 10
      max-wait-seconds: 5
      lease-seconds: 300

  ingestion:
    embedding-cache:
      enabled: true
      max-entries: 100000  # 按 last_used 淘汰；1536 维一条约 6 KB
  knowledge:
    schedule:
      scan-delay-ms: 10000
      lock-seconds: 900
      batch-size: 20
      min-interval-seconds: 60

  mcp:
    servers:
      - name: default
        url: http://localhost:9099

  search:
    # 检索漏斗三段预算，各自独立、单调收窄，启动时校验 recall-budget ≥ default-top-k 且 rerank-candidate-limit ≥ default-top-k
    default-top-k: 10           # ③ 最终进 LLM 的条数（产品语义的 topK）
    recall-budget: 20           # ① 每通道召回条数（绝对值，各通道共用）；须 ≥ default-top-k，0=回退 default-top-k
    request-level-refill-enabled: false # 多子问题请求级去重与公平回填；重复评测通过门槛后再默认开启
    # 检索作用域：本次请求该看哪些知识库，与用什么模态检索无关，故与 channels 平级、三条通道共读
    # 判定只看 KB 意图最高分，不看意图个数；关掉任一通道都不影响其余通道的作用域
    scope:
      fallback-mode: global       # global=兼容模式，empty=无有效KB意图时不检索任何库
      min-intent-score: 0.4        # 低于此分的意图节点不参与「是否收窄」的判定
      confidence-threshold: 0.6    # KB 意图最高分低于此值 → 退化为全库检索
      supplement-ratio: 0.25       # 定向时各通道从自身产出额度划给「未命中库」的保底比例，兜住意图判错；0=关闭补充路，命中库已覆盖全库时自动不补
    channels:
      timeout-ms: 15000     # 单通道查询超时上限（毫秒）
      vector:
        enabled: true       # 向量通道总开关
      web-search:
        enabled: false
        count: 5
        timeout-seconds: 10
        api-key: ${YDC_API_KEY:}
    fusion:
      strategy: rrf
      rrf-k: 20                   # 候选池通常仅 20~40 条，k=60 会过度平滑名次；调低至 20 让头部更有区分度（配合「检索归因」日志校准）
      rerank-candidate-limit: 40  # ② RRF 融合后送入 Rerank 的候选池上限，<=0 不截断（经验值 40~100）
      channel-weights:
        vector: 1.0
        web-search: 0.5

  trace:
    enabled: true
    max-error-length: 1000

  # 图片解析（图生文）配置
  # 产出一段自包含的知识文本：既说清"图是什么"，又完整保留所有文字与层级
  image-parse:
    description-prompt: |-
      请把这张图片的内容转写成一段自包含的知识文本，用于知识库检索与问答，不要描述颜色、布局、字体等视觉样式。要求：
      1. 开头用一两句话说明这张图是什么（主题、类型、用途），让人不看图也能明白讲的是什么。
      2. 随后按图中的分组、层级、流程关系，完整转写所有文字内容（OCR），保留每个分组标题与其下属条目的归属关系，不要遗漏任何文字。
      3. 若是图表、架构图或流程图，请补充说明各部分之间的关系（如包含、调用、先后顺序），而不只是罗列文字。
      4. 保持术语准确完整，表述贴近用户可能的提问方式。
      5. 最后另起一行，用一句话自然引出图片（例如"下方为该内容对应的原始图片："），以便在这段文字后紧接着展示图片。
    max-output-tokens: 4096

research:
  model-id: research-flash
  main-model-id: ${RESEARCH_MAIN_MODEL_ID:research-max}
  worker-model-id: ${RESEARCH_WORKER_MODEL_ID:research-flash}
  finalization-model-id: ${RESEARCH_FINALIZATION_MODEL_ID:research-max}
  max-concurrent-runs: 2
  queue-capacity: 32
  max-concurrent-model-calls: 2
  max-concurrent-workers: 2
  max-total-workers: 4
  max-worker-model-calls: 6
  worker-timeout-seconds: 180
  max-model-calls: 16
  max-tool-calls: 24
  max-duration-seconds: 300
  model-call-timeout-seconds: 60
  tool-timeout-seconds: 30
  reserved-finalization-model-calls: 2
  max-input-tokens: 28000
  max-output-tokens: 4096
  explicit-prompt-cache: true
  # 多实例持久化执行：短租约 + 心跳续租，过期由任一实例经数据库轮询接管（W2）。
  lease-seconds: 30
  heartbeat-seconds: 10
  poll-seconds: 5
  max-takeovers: 3
  shutdown-grace-seconds: 20

ai:
  providers:
    ollama:
      url: http://localhost:11434
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings
    bailian:
      url: https://dashscope.aliyuncs.com
      api-key: ${BAILIAN_API_KEY:}
      endpoints:
        chat: /compatible-mode/v1/chat/completions
        rerank: /api/v1/services/rerank/text-rerank/text-rerank
    aihubmix:
      url: https://aihubmix.com
      api-key: ${AIHUBMIX_API_KEY:}
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings
    siliconflow:
      url: https://api.siliconflow.cn
      api-key: ${SILICONFLOW_API_KEY:}
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings

  selection:
    failure-threshold: 2
    open-duration-ms: 30000

  stream:
    message-chunk-size: 1

  chat:
    candidates:
      - id: qwen-plus
        provider: bailian
        model: qwen-plus-latest
      - id: qwen-flash
        provider: bailian
        model: qwen-flash
      - id: research-flash
        provider: bailian
        model: qwen3.7-flash-2026-07-15
        supports-tool-calling: true
      - id: research-max
        provider: bailian
        model: qwen3.7-max-2026-05-20
        supports-tool-calling: true
      - id: qwen3-local
        provider: ollama
        model: qwen3:8b-fp16
      - id: qwen3-max
        provider: bailian
        model: qwen3-max
        supports-thinking: true
      - id: glm-4.7
        provider: siliconflow
        model: Pro/zai-org/GLM-4.7
        supports-thinking: true
      - id: gpt-5.4
        provider: aihubmix
        model: gpt-5.4

    default-tier: standard
    deep-thinking-tier: deep

    tiers:
      fast:
        candidates: [ qwen-flash, qwen-plus, qwen3-local ]
        timeout-ms: 5000
      standard:
        candidates: [ qwen3-max, qwen-plus, qwen3-local, gpt-5.4 ]
        timeout-ms: 30000
      deep:
        candidates: [ qwen3-max, glm-4.7 ]
        timeout-ms: 120000

  embedding:
    default-model: qwen-emb-8b
    candidates:
      - id: qwen-emb-8b
        provider: siliconflow
        model: Qwen/Qwen3-Embedding-8B
        dimension: ${rag.default.dimension}
        priority: 1
      - id: qwen-emb-local
        provider: ollama
        model: qwen3-embedding:8b-fp16
        dimension: ${rag.default.dimension}
        priority: 2
      - id: text-embedding-3-large
        provider: aihubmix
        model: text-embedding-3-large
        dimension: ${rag.default.dimension}
        priority: 3

  rerank:
    default-model: qwen3-rerank
    candidates:
      - id: qwen3-rerank
        provider: bailian
        model: qwen3-rerank
        priority: 1
      - id: rerank-noop
        provider: noop
        model: noop
        priority: 100

  vlm:
    default-model: qwen-vl-max
    candidates:
      - id: qwen-vl-max
        provider: bailian
        model: qwen-vl-max

# MinerU SaaS API 配置（PDF / Word / PPT 走 MinerU 解析）
mineru:
  api-url: https://mineru.net/api/v4
  api-key: ${MINERU_API_KEY:}
  poll-interval-seconds: 5
  timeout-seconds: 300
  enable-table: true
  enable-formula: true
  ocr: false
  language: ch
  concurrency-limit: 5
  semaphore-name: rag:mineru:parse
  max-wait-seconds: 30
  lease-seconds: 900

sa-token:
  token-name: Authorization
  timeout: 2592000
  is-concurrent: true
  is-share: false
  token-style: simple-uuid
  is-log: false
  is-print: false
