# Merge this after the normal application.yaml when creating another local
# evaluation profile.  Provider API keys stay in environment variables.
ragent:
  engine:
    type: workflow
  demo-mode: false
  eval:
    enabled: true

rag:
  query-rewrite:
    enabled: true
  rerank:
    enabled: true
  citation:
    enabled: true
  search:
    default-top-k: 10
    recall-budget: 20
    scope:
      fallback-mode: global
      min-intent-score: 0.4
      confidence-threshold: 0.6
      supplement-ratio: 0.25
    channels:
      timeout-ms: 15000
      vector:
        enabled: true
      keyword:
        enabled: false
      graph:
        enabled: false
      web-search:
        enabled: false
    fusion:
      strategy: rrf
      rrf-k: 20
      rerank-candidate-limit: 40
      channel-weights:
        vector: 1.0
        keyword: 1.0
        graph: 0.8
        web-search: 0.5

ai:
  chat:
    tiers:
      fast:
        candidates: [qwen3-max]
        timeout-ms: 30000
      standard:
        candidates: [qwen3-max]
        timeout-ms: 30000
      deep:
        candidates: [qwen3-max]
        timeout-ms: 120000
  embedding:
    default-model: qwen-emb-8b
    candidates:
      - id: qwen-emb-8b
        provider: siliconflow
        model: Qwen/Qwen3-Embedding-8B
        dimension: ${rag.default.dimension}
        priority: 1
  rerank:
    default-model: qwen3-rerank
    candidates:
      - id: qwen3-rerank
        provider: bailian
        model: qwen3-rerank
        priority: 1

mineru:
  ocr: false
