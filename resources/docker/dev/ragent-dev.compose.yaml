name: ragent-iron-ore-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ragent
      POSTGRES_USER: ${RAGENT_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${RAGENT_POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../database/schema_pg.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../../database/init_data_pg.sql:/docker-entrypoint-initdb.d/02-init-data.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.8.0
    environment:
      RAGENT_REDIS_PASSWORD: ${RAGENT_REDIS_PASSWORD:-123456}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$RAGENT_REDIS_PASSWORD"
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "REDISCLI_AUTH=$$RAGENT_REDIS_PASSWORD redis-cli ping | grep -q PONG" ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.72
    environment:
      RUSTFS_ACCESS_KEY: ${RAGENT_S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RAGENT_S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    command:
      - --address
      - :9000
      - --console-enable
      - --access-key
      - ${RAGENT_S3_ACCESS_KEY:-rustfsadmin}
      - --secret-key
      - ${RAGENT_S3_SECRET_KEY:-rustfsadmin}
      - /data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:9000/health | grep -q '\"status\":\"ok\"'" ]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rocketmq-nameserver:
    image: apache/rocketmq:5.2.0
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx400m"
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    healthcheck:
      test: [ "CMD-SHELL", "grep -q 'The Name Server boot success' /home/rocketmq/logs/rocketmqlogs/namesrv.log" ]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rocketmq-store-init:
    image: apache/rocketmq:5.2.0
    user: "0:0"
    entrypoint: [ "/bin/sh", "-c" ]
    command: [ "chown 3000:3000 /store && chmod 0750 /store" ]
    volumes:
      - rocketmq-data:/store
    restart: "no"

  rocketmq-broker:
    image: apache/rocketmq:5.2.0
    environment:
      NAMESRV_ADDR: rocketmq-nameserver:9876
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
    depends_on:
      rocketmq-nameserver:
        condition: service_healthy
      rocketmq-store-init:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - |
        cat > /home/rocketmq/rocketmq-5.2.0/conf/broker.conf << EOF
        brokerClusterName = DefaultCluster
        brokerName = broker-a
        brokerId = 0
        deleteWhen = 04
        fileReservedTime = 48
        brokerRole = ASYNC_MASTER
        flushDiskType = ASYNC_FLUSH
        brokerIP1 = 127.0.0.1
        diskMaxUsedSpaceRatio = 88
        timerMaxDelaySec = 31622400
        EOF
        exec sh mqbroker --enable-proxy -c /home/rocketmq/rocketmq-5.2.0/conf/broker.conf
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
    volumes:
      - rocketmq-data:/home/rocketmq/store
    restart: unless-stopped

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:2.1.0
    network_mode: service:rocketmq-broker
    environment:
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
        -XX:MaxMetaspaceSize=256m
        -Drocketmq.config.enableDashBoardCollect=false
        -Drocketmq.namesrv.addr=rocketmq-nameserver:9876
        -Dserver.port=8082
    depends_on:
      rocketmq-broker:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
  rocketmq-data:
